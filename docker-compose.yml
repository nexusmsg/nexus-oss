name: nexus-oss

# Shared environment for the two worker binaries (same image, different entry).
x-worker-env: &worker-env
  SUPABASE_DSN: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/waba?sslmode=disable
  WHATSMEOW_STORE_DSN: ""
  MIGRATIONS_DIR: /app/migrations
  POLL_INTERVAL: "1s"
  API_URL: http://dashboard:3000
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
  MAX_ATTEMPTS: "3"
  WEBHOOK_CONFIG_TTL: "30s"
  HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-10s}
  BUSINESS_ACCOUNT_ID: ${BUSINESS_ACCOUNT_ID:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: waba
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d waba"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    # The image ENTRYPOINT is /app/worker (the default command); reset it so this
    # command runs the migration binary directly.
    entrypoint: []
    command: ["/app/migrate", "-direction", "up"]
    environment:
      SUPABASE_DSN: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/waba?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/waba
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}
      NEXT_PUBLIC_API_TOKEN: ${API_AUTH_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      API_KEY_ENCRYPTION_KEY: ${API_KEY_ENCRYPTION_KEY:-}
      API_KEY_ENCRYPTION_KEY_PREVIOUS: ${API_KEY_ENCRYPTION_KEY_PREVIOUS:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: &worker-build
      context: .
      dockerfile: services/worker/Dockerfile
    # Stateless dispatcher: polls jobs -> forwards to whatsmeow_jobs. No
    # WhatsApp state, so it is safe to scale horizontally (WORKER_REPLICAS,
    # or `docker compose up --scale worker=N`).
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    environment: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  whatsapp_worker:
    build: *worker-build
    # The image ENTRYPOINT is /app/worker (the stateless dispatcher); reset it
    # so this service runs the stateful executor instead.
    entrypoint: []
    command: ["/app/whatsapp_worker"]
    # SINGLE INSTANCE ONLY — do not scale. Every instance opens live WhatsApp
    # connections to the same accounts; running more than one risks an account
    # ban.
    deploy:
      replicas: 1
    environment: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
