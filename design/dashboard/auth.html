<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0d0e;--surface:#15171a;--surface-raised:#1a1d21;--surface-hover:#1e2126;
  --fg:#e8eaed;--muted:#7a7e85;--border:#262a2f;--border-light:#1e2126;
  --accent:#34d399;--accent-hover:#2abb86;--accent-dim:rgba(52,211,153,.12);
  --primary:#34d399;--secondary:#60a5fa;--warning:#fbbf24;--danger:#f87171;--success:#34d399;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --radius:6px;--radius-lg:10px;
}
html{font-family:var(--font-body);color:var(--fg);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}

.auth-container{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}

/* Logo */
.logo{display:flex;align-items:center;gap:10px;margin-bottom:32px}
.logo svg{width:28px;height:28px;color:var(--accent)}
.logo-text{font-size:22px;font-weight:700;letter-spacing:-0.03em;color:var(--fg)}

/* Card */
.auth-card{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px}
.auth-title{font-size:20px;font-weight:700;letter-spacing:-0.02em;text-align:center;margin-bottom:4px}
.auth-subtitle{font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px}

/* Social Buttons */
.social-buttons{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.social-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:10px 16px;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--surface-raised);color:var(--fg);font-family:var(--font-body)}
.social-btn:hover{border-color:var(--muted);background:var(--surface-hover)}
.social-btn svg{width:18px;height:18px;flex-shrink:0}

/* Divider */
.divider{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:500}

/* Form */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.04em}
.form-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;color:var(--fg);font-size:14px;font-family:var(--font-body);outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--accent)}
.form-input.mono{font-family:var(--font-mono)}

.form-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.remember-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer}
.remember-label input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.forgot-link{font-size:13px;color:var(--accent);text-decoration:none;font-weight:500}
.forgot-link:hover{text-decoration:underline}

/* Submit */
.submit-btn{width:100%;padding:10px 16px;border-radius:var(--radius);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;border:none;background:var(--accent);color:#0c0d0e;font-family:var(--font-body)}
.submit-btn:hover{background:var(--accent-hover)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}

/* Footer */
.auth-footer{margin-top:20px;text-align:center;font-size:13px;color:var(--muted)}
.auth-footer a{color:var(--accent);text-decoration:none;font-weight:500}
.auth-footer a:hover{text-decoration:underline}

/* Separator */
.separator{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.separator::before,.separator::after{content:'';flex:1;height:1px;background:var(--border)}
.separator span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;font-weight:500}

/* Status dot */
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;margin-right:6px}

/* Responsive */
@media(max-width:480px){
  .auth-card{padding:24px}
}
</style>
</head>
<body data-od-id="auth-login">

<div class="auth-container">
  <a href="index.html" class="logo" style="text-decoration:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h6v6H4z"/><path d="M14 4h6v6h-6z"/><path d="M4 14h6v6H4z"/><path d="M14 14h6v6h-6z"/></svg>
    <span class="logo-text">Nexus</span>
  </a>

  <div class="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to your developer account</p>

    <!-- Social Login -->
    <div class="social-buttons">
      <button class="social-btn" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
      <button class="social-btn" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--fg)"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        Continue with GitHub
      </button>
    </div>

    <div class="separator"><span>or</span></div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input class="form-input" type="email" id="email" placeholder="you@company.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input mono" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div class="form-row">
        <label class="remember-label">
          <input type="checkbox" id="remember">
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="submit-btn">Sign in</button>
    </form>
  </div>

  <p class="auth-footer">
    Don't have an account? <a href="register.html">Create one</a>
  </p>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  const btn = e.target.querySelector('.submit-btn');
  btn.textContent = 'Signing in...';
  btn.disabled = true;
  setTimeout(() => {
    btn.textContent = 'Sign in';
    btn.disabled = false;
    window.location.href = 'dashboard.html';
  }, 1200);
  return false;
}
</script>

</body>
</html>
